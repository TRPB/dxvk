name: Artifacts (Package)

on: [push, pull_request, workflow_dispatch]

env:
  # Revision of this fork, appended to the upstream DXVK build number
  # read from ./RELEASE. Bump this for every new release cut against the
  # same upstream base; it goes back to 1 when ./RELEASE changes.
  DXVK_FORK_REVISION: 1

jobs:
  version:
    runs-on: ubuntu-latest

    outputs:
      name: ${{ steps.get-version.outputs.name }}

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v6

    - name: Get version
      id: get-version
      shell: bash
      run: |
        # Releases are named after the upstream build number plus this
        # fork's revision, e.g. upstream 3.1.1 + revision 1 -> 3.1.1.1.
        # Everything else keeps the branch-and-commit name so that dev
        # artifacts stay traceable to the commit they were built from.
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "name=$(cat RELEASE).${DXVK_FORK_REVISION}" >> $GITHUB_OUTPUT
        else
          echo "name=${GITHUB_REF##*/}-${GITHUB_SHA##*/}" >> $GITHUB_OUTPUT
        fi

  artifacts-mingw-w64:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    needs: version

    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}

    steps:
    - name: Setup container
      run: |
        pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup problem matcher
      uses: Joshua-Ashton/gcc-problem-matcher@master

    - name: Build release
      id: build-release
      run: |
        ./package-release.sh ${VERSION_NAME} build --no-package

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dxvk-${{ env.VERSION_NAME }}
        path: build/dxvk-${{ env.VERSION_NAME }}
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [version, artifacts-mingw-w64]
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}

    steps:
    - name: Download build
      id: download-build
      uses: actions/download-artifact@v7
      with:
        name: dxvk-${{ needs.version.outputs.name }}
        path: dxvk

    - name: Package d3d9 DLLs
      id: package-dlls
      run: |
        # d3d9 is the only DLL this fork patches, so that is all the
        # release ships. The full DXVK DLL set stays available as the
        # build artifact on the run itself.
        mkdir -p "dxvk-${VERSION_NAME}/x32" "dxvk-${VERSION_NAME}/x64"
        cp dxvk/x32/d3d9.dll "dxvk-${VERSION_NAME}/x32/"
        cp dxvk/x64/d3d9.dll "dxvk-${VERSION_NAME}/x64/"
        zip -r "dxvk-${VERSION_NAME}.zip" "dxvk-${VERSION_NAME}"

    - name: Publish release
      id: publish-release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${GITHUB_REF#refs/tags/}"

        # VERSION_NAME is <upstream build number>.<fork revision>, so
        # stripping the last component names the upstream base.
        cat > notes.md <<EOF
        Based on upstream DXVK ${VERSION_NAME%.*}.

        Contains \`x32/d3d9.dll\` and \`x64/d3d9.dll\`. Drop the one matching the game's architecture into its directory.
        EOF

        # Re-running a tag refreshes the asset rather than failing on an
        # already-published release.
        if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          gh release upload "${TAG}" "dxvk-${VERSION_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}" --clobber
        else
          gh release create "${TAG}" "dxvk-${VERSION_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}"                       \
            --title "${TAG}"                                    \
            --notes-file notes.md
        fi
